<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로렌츠 끌개 시뮬레이션</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            overflow-x: hidden;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            color: white;
            padding: 30px 0;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .subtitle {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 20px;
            margin-bottom: 20px;
        }

        .canvas-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            overflow: hidden;
            position: relative;
        }

        #canvas3d {
            width: 100%;
            height: 600px;
            display: block;
        }

        .controls-panel {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            max-height: 600px;
            overflow-y: auto;
        }

        .control-section {
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
        }

        .control-section:last-child {
            border-bottom: none;
        }

        .control-section h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.1em;
        }

        .parameter-group {
            margin-bottom: 15px;
        }

        .parameter-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 0.9em;
            color: #555;
        }

        .param-name {
            font-weight: 600;
        }

        .param-value {
            color: #667eea;
            font-weight: bold;
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: linear-gradient(to right, #667eea, #764ba2);
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: white;
            border: 3px solid #667eea;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: white;
            border: 3px solid #667eea;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .button-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .button-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(102, 126, 234, 0.4);
        }

        .button-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .button-secondary:hover {
            background: #e0e0e0;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            margin: 10px 0;
        }

        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin-right: 10px;
            cursor: pointer;
        }

        .checkbox-group label {
            cursor: pointer;
            user-select: none;
        }

        .stats-display {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
            font-size: 0.9em;
        }

        .stat-label {
            color: #666;
        }

        .stat-value {
            font-weight: bold;
            color: #667eea;
        }

        .charts-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .chart-box {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .chart-box h3 {
            color: #667eea;
            margin-bottom: 15px;
            text-align: center;
        }

        canvas.chart {
            width: 100%;
            height: 300px;
            display: block;
        }

        .preset-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .preset-btn {
            padding: 10px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .preset-btn:hover {
            background: #667eea;
            color: white;
        }

        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255,255,255,0.9);
            display: none;
            justify-content: center;
            align-items: center;
            font-size: 1.2em;
            color: #667eea;
            z-index: 10;
        }

        @media (max-width: 1024px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            .controls-panel {
                max-height: none;
            }
        }

        .color-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 5px;
        }

        .info-box {
            background: #e3f2fd;
            border-left: 4px solid #2196F3;
            padding: 12px;
            margin: 15px 0;
            border-radius: 4px;
            font-size: 0.85em;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🦋 로렌츠 끌개 시뮬레이션</h1>
            <p class="subtitle">카오스 이론과 나비 효과의 시각화</p>
        </header>

        <div class="main-content">
            <div class="canvas-container">
                <div id="canvas3d"></div>
                <div class="loading-overlay" id="loading">
                    계산 중...
                </div>
            </div>

            <div class="controls-panel">
                <div class="control-section">
                    <h3>🎮 시뮬레이션 제어</h3>
                    <button class="button button-primary" id="startBtn">시작</button>
                    <button class="button button-secondary" id="resetBtn">초기화</button>
                    <button class="button button-secondary" id="clearBtn">궤적 지우기</button>
                    
                    <div class="checkbox-group">
                        <input type="checkbox" id="autoRotate" checked>
                        <label for="autoRotate">자동 회전</label>
                    </div>
                    
                    <div class="checkbox-group">
                        <input type="checkbox" id="showAxes" checked>
                        <label for="showAxes">좌표축 표시</label>
                    </div>
                </div>

                <div class="control-section">
                    <h3>⚙️ 파라미터 설정</h3>
                    
                    <div class="parameter-group">
                        <div class="parameter-label">
                            <span class="param-name">σ (시그마)</span>
                            <span class="param-value" id="sigmaValue">10.0</span>
                        </div>
                        <input type="range" id="sigma" min="0" max="20" step="0.1" value="10">
                    </div>

                    <div class="parameter-group">
                        <div class="parameter-label">
                            <span class="param-name">ρ (로)</span>
                            <span class="param-value" id="rhoValue">28.0</span>
                        </div>
                        <input type="range" id="rho" min="0" max="50" step="0.1" value="28">
                    </div>

                    <div class="parameter-group">
                        <div class="parameter-label">
                            <span class="param-name">β (베타)</span>
                            <span class="param-value" id="betaValue">2.67</span>
                        </div>
                        <input type="range" id="beta" min="0" max="10" step="0.01" value="2.67">
                    </div>

                    <div class="info-box">
                        카오스는 ρ ≈ 24.74 이상에서 발생합니다
                    </div>
                </div>

                <div class="control-section">
                    <h3>📍 초기 조건</h3>
                    
                    <div class="parameter-group">
                        <div class="parameter-label">
                            <span class="param-name">X₀</span>
                            <span class="param-value" id="x0Value">0.0</span>
                        </div>
                        <input type="range" id="x0" min="-20" max="20" step="0.1" value="0">
                    </div>

                    <div class="parameter-group">
                        <div class="parameter-label">
                            <span class="param-name">Y₀</span>
                            <span class="param-value" id="y0Value">1.0</span>
                        </div>
                        <input type="range" id="y0" min="-20" max="20" step="0.1" value="1">
                    </div>

                    <div class="parameter-group">
                        <div class="parameter-label">
                            <span class="param-name">Z₀</span>
                            <span class="param-value" id="z0Value">1.05</span>
                        </div>
                        <input type="range" id="z0" min="-20" max="40" step="0.01" value="1.05">
                    </div>

                    <div class="checkbox-group">
                        <input type="checkbox" id="compareMode">
                        <label for="compareMode">초기 조건 비교 모드</label>
                    </div>
                </div>

                <div class="control-section">
                    <h3>🎨 프리셋</h3>
                    <div class="preset-buttons">
                        <button class="preset-btn" data-preset="classic">클래식</button>
                        <button class="preset-btn" data-preset="stable">안정</button>
                        <button class="preset-btn" data-preset="extreme">극단</button>
                        <button class="preset-btn" data-preset="bifurcation">분기점</button>
                    </div>
                </div>

                <div class="control-section">
                    <h3>📊 통계</h3>
                    <div class="stats-display">
                        <div class="stat-item">
                            <span class="stat-label">계산된 점</span>
                            <span class="stat-value" id="pointCount">0</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">시뮬레이션 시간</span>
                            <span class="stat-value" id="simTime">0.00s</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">FPS</span>
                            <span class="stat-value" id="fps">60</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="charts-container">
            <div class="chart-box">
                <h3>
                    <span class="color-indicator" style="background: #ff0080;"></span>
                    X-Y 평면 투영
                </h3>
                <canvas id="xyChart" class="chart"></canvas>
            </div>
            <div class="chart-box">
                <h3>
                    <span class="color-indicator" style="background: #00ff80;"></span>
                    X-Z 평면 투영
                </h3>
                <canvas id="xzChart" class="chart"></canvas>
            </div>
            <div class="chart-box">
                <h3>
                    <span class="color-indicator" style="background: #0080ff;"></span>
                    시간에 따른 X 변화
                </h3>
                <canvas id="timeChart" class="chart"></canvas>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Three.js 설정
        let scene, camera, renderer, controls;
        let trajectoryLine, trajectoryLine2;
        let axes;
        let isAnimating = false;
        let animationId;

        // 로렌츠 시스템 변수
        let sigma = 10;
        let rho = 28;
        let beta = 8/3;
        let x = 0, y = 1, z = 1.05;
        let x2 = 0, y2 = 1, z2 = 1.05001; // 비교 모드용
        let dt = 0.01;
        let maxPoints = 3000;
        let trajectoryPoints = [];
        let trajectoryPoints2 = [];
        let simTime = 0;
        let pointCount = 0;

        // 2D 차트 데이터
        let xyData = [];
        let xzData = [];
        let timeData = [];
        let timeLabels = [];

        // 초기화
        function init() {
            // Scene 설정
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf8f9fa);

            // Camera 설정
            const container = document.getElementById('canvas3d');
            camera = new THREE.PerspectiveCamera(
                60,
                container.clientWidth / container.clientHeight,
                0.1,
                1000
            );
            camera.position.set(50, 50, 50);
            camera.lookAt(0, 25, 25);

            // Renderer 설정
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderer.domElement);

            // 조명
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.4);
            directionalLight.position.set(10, 10, 10);
            scene.add(directionalLight);

            // 좌표축
            createAxes();

            // 궤적 라인
            createTrajectoryLines();

            // 마우스 컨트롤 (간이 버전)
            setupMouseControls();

            // 2D 차트 초기화
            initCharts();

            // 이벤트 리스너
            setupEventListeners();

            // 렌더링 시작
            animate();
        }

        function createAxes() {
            const axesGroup = new THREE.Group();
            
            const axisLength = 60;
            const axesMaterial = [
                new THREE.LineBasicMaterial({ color: 0xff0000 }), // X - Red
                new THREE.LineBasicMaterial({ color: 0x00ff00 }), // Y - Green
                new THREE.LineBasicMaterial({ color: 0x0000ff })  // Z - Blue
            ];

            // X축
            const xGeom = new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(-axisLength, 0, 0),
                new THREE.Vector3(axisLength, 0, 0)
            ]);
            axesGroup.add(new THREE.Line(xGeom, axesMaterial[0]));

            // Y축
            const yGeom = new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(0, -axisLength, 0),
                new THREE.Vector3(0, axisLength, 0)
            ]);
            axesGroup.add(new THREE.Line(yGeom, axesMaterial[1]));

            // Z축
            const zGeom = new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(0, 0, -axisLength),
                new THREE.Vector3(0, 0, axisLength)
            ]);
            axesGroup.add(new THREE.Line(zGeom, axesMaterial[2]));

            axes = axesGroup;
            scene.add(axes);
        }

        function createTrajectoryLines() {
            const geometry = new THREE.BufferGeometry();
            const material = new THREE.LineBasicMaterial({ 
                color: 0x667eea,
                linewidth: 2
            });
            trajectoryLine = new THREE.Line(geometry, material);
            scene.add(trajectoryLine);

            // 두 번째 궤적 (비교 모드용)
            const geometry2 = new THREE.BufferGeometry();
            const material2 = new THREE.LineBasicMaterial({ 
                color: 0xff0080,
                linewidth: 2
            });
            trajectoryLine2 = new THREE.Line(geometry2, material2);
            scene.add(trajectoryLine2);
        }

        function setupMouseControls() {
            let isDragging = false;
            let previousMousePosition = { x: 0, y: 0 };

            renderer.domElement.addEventListener('mousedown', (e) => {
                isDragging = true;
                previousMousePosition = { x: e.clientX, y: e.clientY };
            });

            renderer.domElement.addEventListener('mousemove', (e) => {
                if (isDragging) {
                    const deltaX = e.clientX - previousMousePosition.x;
                    const deltaY = e.clientY - previousMousePosition.y;

                    camera.position.applyAxisAngle(new THREE.Vector3(0, 1, 0), deltaX * 0.01);
                    
                    previousMousePosition = { x: e.clientX, y: e.clientY };
                }
            });

            renderer.domElement.addEventListener('mouseup', () => {
                isDragging = false;
            });

            // 줌
            renderer.domElement.addEventListener('wheel', (e) => {
                e.preventDefault();
                const delta = e.deltaY * 0.1;
                camera.position.multiplyScalar(1 + delta * 0.001);
            });
        }

        // 로렌츠 방정식
        function lorenzDerivative(x, y, z) {
            return {
                dx: sigma * (y - x),
                dy: x * (rho - z) - y,
                dz: x * y - beta * z
            };
        }

        // 4차 룽게-쿠타 법
        function rungeKutta(x, y, z, dt) {
            const k1 = lorenzDerivative(x, y, z);
            const k2 = lorenzDerivative(
                x + 0.5 * dt * k1.dx,
                y + 0.5 * dt * k1.dy,
                z + 0.5 * dt * k1.dz
            );
            const k3 = lorenzDerivative(
                x + 0.5 * dt * k2.dx,
                y + 0.5 * dt * k2.dy,
                z + 0.5 * dt * k2.dz
            );
            const k4 = lorenzDerivative(
                x + dt * k3.dx,
                y + dt * k3.dy,
                z + dt * k3.dz
            );

            return {
                x: x + (dt / 6) * (k1.dx + 2*k2.dx + 2*k3.dx + k4.dx),
                y: y + (dt / 6) * (k1.dy + 2*k2.dy + 2*k3.dy + k4.dy),
                z: z + (dt / 6) * (k1.dz + 2*k2.dz + 2*k3.dz + k4.dz)
            };
        }

        function updateTrajectory() {
            // 첫 번째 궤적 업데이트
            const newPoint = rungeKutta(x, y, z, dt);
            x = newPoint.x;
            y = newPoint.y;
            z = newPoint.z;

            trajectoryPoints.push(new THREE.Vector3(x, y, z));
            if (trajectoryPoints.length > maxPoints) {
                trajectoryPoints.shift();
            }

            // 두 번째 궤적 (비교 모드)
            if (document.getElementById('compareMode').checked) {
                const newPoint2 = rungeKutta(x2, y2, z2, dt);
                x2 = newPoint2.x;
                y2 = newPoint2.y;
                z2 = newPoint2.z;

                trajectoryPoints2.push(new THREE.Vector3(x2, y2, z2));
                if (trajectoryPoints2.length > maxPoints) {
                    trajectoryPoints2.shift();
                }

                trajectoryLine2.geometry.setFromPoints(trajectoryPoints2);
                trajectoryLine2.visible = true;
            } else {
                trajectoryLine2.visible = false;
            }

            trajectoryLine.geometry.setFromPoints(trajectoryPoints);

            // 2D 차트 데이터 업데이트
            xyData.push({ x: x, y: y });
            xzData.push({ x: x, y: z });
            timeData.push(x);
            timeLabels.push(simTime.toFixed(2));

            if (xyData.length > 500) {
                xyData.shift();
                xzData.shift();
                timeData.shift();
                timeLabels.shift();
            }

            simTime += dt;
            pointCount = trajectoryPoints.length;

            updateStats();
        }

        function updateStats() {
            document.getElementById('pointCount').textContent = pointCount;
            document.getElementById('simTime').textContent = simTime.toFixed(2) + 's';
        }

        let lastTime = performance.now();
        let frameCount = 0;
        let autoRotateAngle = 0;

        function animate() {
            animationId = requestAnimationFrame(animate);

            // FPS 계산
            frameCount++;
            const currentTime = performance.now();
            if (currentTime - lastTime >= 1000) {
                document.getElementById('fps').textContent = frameCount;
                frameCount = 0;
                lastTime = currentTime;
            }

            if (isAnimating) {
                for (let i = 0; i < 5; i++) { // 속도 향상을 위해 프레임당 5스텝
                    updateTrajectory();
                }
                updateCharts();
            }

            // 자동 회전
            if (document.getElementById('autoRotate').checked) {
                autoRotateAngle += 0.003;
                camera.position.x = Math.cos(autoRotateAngle) * 70;
                camera.position.z = Math.sin(autoRotateAngle) * 70;
                camera.lookAt(0, 25, 25);
            }

            renderer.render(scene, camera);
        }

        // 2D 차트
        function initCharts() {
            const canvases = ['xyChart', 'xzChart', 'timeChart'];
            canvases.forEach(id => {
                const canvas = document.getElementById(id);
                const ctx = canvas.getContext('2d');
                canvas.width = canvas.offsetWidth * 2;
                canvas.height = canvas.offsetHeight * 2;
                ctx.scale(2, 2);
            });
        }

        function drawChart(canvasId, data, color, xLabel, yLabel) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');
            const w = canvas.width / 2;
            const h = canvas.height / 2;

            ctx.clearRect(0, 0, w, h);

            if (data.length < 2) return;

            // 배경
            ctx.fillStyle = '#f8f9fa';
            ctx.fillRect(0, 0, w, h);

            // 데이터 범위 계산
            let minX = Infinity, maxX = -Infinity;
            let minY = Infinity, maxY = -Infinity;

            data.forEach(point => {
                if (point.x < minX) minX = point.x;
                if (point.x > maxX) maxX = point.x;
                if (point.y < minY) minY = point.y;
                if (point.y > maxY) maxY = point.y;
            });

            const margin = 40;
            const plotW = w - 2 * margin;
            const plotH = h - 2 * margin;

            const scaleX = plotW / (maxX - minX || 1);
            const scaleY = plotH / (maxY - minY || 1);

            // 그리드
            ctx.strokeStyle = '#e0e0e0';
            ctx.lineWidth = 1;
            for (let i = 0; i <= 5; i++) {
                const x = margin + (plotW / 5) * i;
                ctx.beginPath();
                ctx.moveTo(x, margin);
                ctx.lineTo(x, h - margin);
                ctx.stroke();

                const y = margin + (plotH / 5) * i;
                ctx.beginPath();
                ctx.moveTo(margin, y);
                ctx.lineTo(w - margin, y);
                ctx.stroke();
            }

            // 데이터 플롯
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.beginPath();

            data.forEach((point, i) => {
                const px = margin + (point.x - minX) * scaleX;
                const py = h - margin - (point.y - minY) * scaleY;

                if (i === 0) {
                    ctx.moveTo(px, py);
                } else {
                    ctx.lineTo(px, py);
                }
            });

            ctx.stroke();

            // 축 레이블
            ctx.fillStyle = '#333';
            ctx.font = '12px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(minX.toFixed(1), margin, h - 10);
            ctx.fillText(maxX.toFixed(1), w - margin, h - 10);
        }

        function updateCharts() {
            drawChart('xyChart', xyData, '#ff0080', 'X', 'Y');
            drawChart('xzChart', xzData, '#00ff80', 'X', 'Z');
            
            // 시간 차트
            const timeChartData = timeData.map((val, i) => ({ x: i, y: val }));
            drawChart('timeChart', timeChartData, '#0080ff', 'Time', 'X');
        }

        // 이벤트 리스너
        function setupEventListeners() {
            // 파라미터 슬라이더
            document.getElementById('sigma').addEventListener('input', (e) => {
                sigma = parseFloat(e.target.value);
                document.getElementById('sigmaValue').textContent = sigma.toFixed(1);
            });

            document.getElementById('rho').addEventListener('input', (e) => {
                rho = parseFloat(e.target.value);
                document.getElementById('rhoValue').textContent = rho.toFixed(1);
            });

            document.getElementById('beta').addEventListener('input', (e) => {
                beta = parseFloat(e.target.value);
                document.getElementById('betaValue').textContent = beta.toFixed(2);
            });

            // 초기 조건 슬라이더
            document.getElementById('x0').addEventListener('input', (e) => {
                const val = parseFloat(e.target.value);
                document.getElementById('x0Value').textContent = val.toFixed(1);
            });

            document.getElementById('y0').addEventListener('input', (e) => {
                const val = parseFloat(e.target.value);
                document.getElementById('y0Value').textContent = val.toFixed(1);
            });

            document.getElementById('z0').addEventListener('input', (e) => {
                const val = parseFloat(e.target.value);
                document.getElementById('z0Value').textContent = val.toFixed(2);
            });

            // 시작/정지 버튼
            document.getElementById('startBtn').addEventListener('click', () => {
                isAnimating = !isAnimating;
                document.getElementById('startBtn').textContent = isAnimating ? '정지' : '시작';
            });

            // 초기화 버튼
            document.getElementById('resetBtn').addEventListener('click', () => {
                resetSimulation();
            });

            // 궤적 지우기
            document.getElementById('clearBtn').addEventListener('click', () => {
                trajectoryPoints = [];
                trajectoryPoints2 = [];
                xyData = [];
                xzData = [];
                timeData = [];
                timeLabels = [];
                trajectoryLine.geometry.setFromPoints([]);
                trajectoryLine2.geometry.setFromPoints([]);
            });

            // 좌표축 토글
            document.getElementById('showAxes').addEventListener('change', (e) => {
                axes.visible = e.target.checked;
            });

            // 프리셋 버튼
            document.querySelectorAll('.preset-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    applyPreset(btn.dataset.preset);
                });
            });

            // 윈도우 리사이즈
            window.addEventListener('resize', () => {
                const container = document.getElementById('canvas3d');
                camera.aspect = container.clientWidth / container.clientHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(container.clientWidth, container.clientHeight);
            });
        }

        function resetSimulation() {
            x = parseFloat(document.getElementById('x0').value);
            y = parseFloat(document.getElementById('y0').value);
            z = parseFloat(document.getElementById('z0').value);
            x2 = x;
            y2 = y;
            z2 = z + 0.00001;
            
            simTime = 0;
            pointCount = 0;
            
            trajectoryPoints = [];
            trajectoryPoints2 = [];
            xyData = [];
            xzData = [];
            timeData = [];
            timeLabels = [];
            
            trajectoryLine.geometry.setFromPoints([]);
            trajectoryLine2.geometry.setFromPoints([]);
            
            updateStats();
        }

        function applyPreset(preset) {
            const presets = {
                classic: { sigma: 10, rho: 28, beta: 8/3, x: 0, y: 1, z: 1.05 },
                stable: { sigma: 10, rho: 15, beta: 8/3, x: 0, y: 1, z: 1 },
                extreme: { sigma: 10, rho: 40, beta: 8/3, x: 5, y: 5, z: 5 },
                bifurcation: { sigma: 10, rho: 24.74, beta: 8/3, x: 0, y: 1, z: 1 }
            };

            const p = presets[preset];
            
            document.getElementById('sigma').value = p.sigma;
            document.getElementById('rho').value = p.rho;
            document.getElementById('beta').value = p.beta;
            document.getElementById('x0').value = p.x;
            document.getElementById('y0').value = p.y;
            document.getElementById('z0').value = p.z;

            sigma = p.sigma;
            rho = p.rho;
            beta = p.beta;

            document.getElementById('sigmaValue').textContent = sigma.toFixed(1);
            document.getElementById('rhoValue').textContent = rho.toFixed(1);
            document.getElementById('betaValue').textContent = beta.toFixed(2);
            document.getElementById('x0Value').textContent = p.x.toFixed(1);
            document.getElementById('y0Value').textContent = p.y.toFixed(1);
            document.getElementById('z0Value').textContent = p.z.toFixed(2);

            resetSimulation();
        }

        // 초기화 실행
        window.addEventListener('load', init);
    </script>
</body>
</html>
