<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualization Gallery</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
            color: white;
        }

        h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .subtitle {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
            margin-top: 40px;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            text-decoration: none;
            color: #333;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .card:hover::before {
            transform: scaleX(1);
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .card-icon {
            font-size: 3em;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .card-title {
            font-size: 1.8em;
            margin-bottom: 15px;
            font-weight: 600;
            color: #2d3748;
        }

        .card-description {
            font-size: 1em;
            color: #718096;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .card-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 15px;
        }

        .tag {
            background: #e6e9ff;
            color: #667eea;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.85em;
            font-weight: 500;
        }

        .card-arrow {
            position: absolute;
            bottom: 20px;
            right: 20px;
            font-size: 1.5em;
            color: #667eea;
            opacity: 0;
            transform: translateX(-10px);
            transition: all 0.3s ease;
        }

        .card:hover .card-arrow {
            opacity: 1;
            transform: translateX(0);
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }

            .cards-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
        }

        /* 추가 버튼 스타일 */
        .add-card-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 2em;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
        }

        .add-card-btn:hover {
            transform: scale(1.1) rotate(90deg);
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>✨ Visualization Gallery</h1>
            <p class="subtitle">Interactive Simulations & Visualizations</p>
        </header>

        <div class="cards-grid">
            <!-- 카드 1: Lorenz Attractor -->
            <a href="lorenz.html" class="card">
                <div class="card-icon">
                    <i class="fas fa-project-diagram"></i>
                </div>
                <h2 class="card-title">Lorenz Attractor</h2>
                <p class="card-description">
                    카오스 이론의 대표적인 예시인 로렌츠 끌개의 아름다운 3D 시각화를 경험해보세요.
                </p>
                <div class="card-tags">
                    <span class="tag">3D</span>
                    <span class="tag">Chaos Theory</span>
                    <span class="tag">Interactive</span>
                </div>
                <i class="fas fa-arrow-right card-arrow"></i>
            </a>

            <!-- 새로운 카드를 추가하려면 아래 템플릿을 복사하세요 -->
            
            <!-- 카드 템플릿 예시 1 -->
            <!--
            <a href="your-page.html" class="card">
                <div class="card-icon">
                    <i class="fas fa-chart-line"></i>
                </div>
                <h2 class="card-title">제목을 입력하세요</h2>
                <p class="card-description">
                    카드에 대한 설명을 입력하세요.
                </p>
                <div class="card-tags">
                    <span class="tag">태그1</span>
                    <span class="tag">태그2</span>
                </div>
                <i class="fas fa-arrow-right card-arrow"></i>
            </a>
            -->

            <!-- 카드 템플릿 예시 2 -->
            <!--
            <a href="another-page.html" class="card">
                <div class="card-icon">
                    <i class="fas fa-cube"></i>
                </div>
                <h2 class="card-title">또 다른 프로젝트</h2>
                <p class="card-description">
                    여기에 프로젝트 설명을 작성합니다.
                </p>
                <div class="card-tags">
                    <span class="tag">WebGL</span>
                    <span class="tag">Animation</span>
                </div>
                <i class="fas fa-arrow-right card-arrow"></i>
            </a>
            -->

        </div>
    </div>

    <script>
        // 카드에 애니메이션 효과 추가
        document.addEventListener('DOMContentLoaded', function() {
            const cards = document.querySelectorAll('.card');
            
            cards.forEach((card, index) => {
                card.style.opacity = '0';
                card.style.transform = 'translateY(30px)';
                
                setTimeout(() => {
                    card.style.transition = 'all 0.5s ease';
                    card.style.opacity = '1';
                    card.style.transform = 'translateY(0)';
                }, index * 100);
            });
        });
    </script>
</body>
</html>
